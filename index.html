<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sach CRM — Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f2f5;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--ac:#0e7c66;--ac2:#c8962e;--bad:#dc2626;--ok:#16a34a;--warn:#d97706;--co:92%;--cb:12px}
:root[data-theme=royal]{--bg:#eef1fa;--ac:#2b3a8c;--ac2:#b8860b}
:root[data-theme=sunset]{--bg:#fdf2ec;--ac:#c2410c;--ac2:#0e7490}
:root[data-theme=plum]{--bg:#f7eefb;--ac:#7e22ce;--ac2:#db2777}
:root[data-theme=ocean]{--bg:#e8f4fb;--ac:#0369a1;--ac2:#f59e0b}
:root[data-theme=rose]{--bg:#fdf0f3;--ac:#be123c;--ac2:#0f766e}
:root[data-theme=forest]{--bg:#ecf6ef;--ac:#166534;--ac2:#b45309}
:root[data-theme=midnight]{--bg:#0a0e14;--card:#161b22;--ink:#e6edf3;--mute:#8b949e;--line:#21262d;--ac:#3fb950;--ac2:#d29922;--bad:#f85149;--ok:#3fb950}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(900px 500px at 0% -5%,color-mix(in srgb,var(--ac) 20%,transparent),transparent),radial-gradient(800px 500px at 100% 0,color-mix(in srgb,var(--ac2) 18%,transparent),transparent)}
#bg3d{position:fixed;inset:-30px;z-index:-1;pointer-events:none;perspective:1000px;overflow:hidden}
.cube{position:absolute;width:var(--s);height:var(--s);transform-style:preserve-3d;animation:spin var(--d) linear infinite,bob calc(var(--d)*.6) ease-in-out infinite alternate}
.cube i{position:absolute;inset:0;border:1.5px solid color-mix(in srgb,var(--ac) 45%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 18%,transparent),color-mix(in srgb,var(--ac2) 12%,transparent))}
.cube i:nth-child(1){transform:translateZ(calc(var(--s)/2))}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}.cube i:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--s)/2))}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2))}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}@keyframes bob{to{translate:0 -45px}}
.orb{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff9,color-mix(in srgb,var(--ac) 40%,transparent) 40%,color-mix(in srgb,var(--ac2) 28%,transparent) 75%,transparent);opacity:.4;animation:bob var(--d) ease-in-out infinite alternate}
#bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;pointer-events:none}
.shell{display:flex;min-height:100vh}
.content{flex:1;min-width:0;margin-left:260px;transition:margin .25s;display:flex;flex-direction:column}
#sb{position:fixed;left:0;top:0;bottom:0;width:260px;display:flex;flex-direction:column;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(20px);border-right:1px solid var(--line);transition:width .25s,transform .25s}
.sb-head{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line);min-height:66px}
.sb-logo{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.sb-brand{font-weight:800;font-size:15px;flex:1;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-badge{font-size:10px;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--ac) 15%,transparent);color:var(--ac);font-weight:800;text-transform:uppercase}
.sb-body{flex:1;overflow-y:auto;padding:10px 0}
.sb-item{display:flex;align-items:center;gap:12px;padding:11px 18px;margin:3px 8px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;transition:.15s;user-select:none}
.sb-item:hover{background:color-mix(in srgb,var(--ac) 8%,transparent);transform:translateX(3px)}
.sb-item.on{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 18%,transparent),transparent);color:var(--ac);font-weight:800;box-shadow:inset 3px 0 0 var(--ac)}
.sb-item .ic{font-size:19px;width:24px;text-align:center}
.sb-item .arrow{margin-left:auto;font-size:12px;opacity:.5;transition:transform .2s}
.sb-item.open .arrow{transform:rotate(90deg)}
.sub{display:none;padding-left:22px;margin-left:12px;border-left:2px solid color-mix(in srgb,var(--ac) 25%,transparent)}
.sub.open{display:block}
.sub-item{padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--mute);transition:.15s}
.sub-item:hover{background:color-mix(in srgb,var(--ac) 8%,transparent);color:var(--ink)}
.sub-item.on{color:var(--ac);font-weight:800;background:color-mix(in srgb,var(--ac) 10%,transparent)}
.sb-foot{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 60%,var(--card));cursor:pointer}
.sb-foot .av{width:38px;height:38px;font-size:16px;position:relative}
.sb-foot span{flex:1;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot-online{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2.5px solid var(--card)}
.dot-offline{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:#94a3b8;border:2.5px solid var(--card)}
header{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.hb{display:none;background:none;border:0;font-size:22px;cursor:pointer;padding:4px 8px}
.page-title{font-size:20px;font-weight:800;margin:0;white-space:nowrap;letter-spacing:-.02em}
.gs-wrap{position:relative;flex:1;max-width:480px;min-width:200px;margin:0 auto}
.gs{width:100%;padding:11px 16px 11px 42px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:14px;color:var(--ink);transition:.2s}
.gs:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 20%,transparent)}
.gs-wrap::before{content:'🔍';position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none}
.gsd{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 40px -12px #000a;max-height:60vh;overflow:auto;display:none;z-index:50}
.gsd.on{display:block}
.gsd-item{display:flex;gap:12px;align-items:center;padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--line);font-size:14px}
.gsd-item:last-child{border:0}
.gsd-item:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.gsd-item .subtxt{font-size:12px;color:var(--mute);margin-top:2px}
.hbtns{display:flex;gap:6px;align-items:center}
.hbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:15px;position:relative;transition:.15s;color:var(--ink)}
.hbtn:hover{background:color-mix(in srgb,var(--ac) 8%,var(--card));border-color:var(--ac)}
.hbtn.p{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 88%,#fff),var(--ac));color:#fff;border-color:var(--ac)}
.hbtn.d{color:var(--bad)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;font-weight:800;padding:2px 6px;min-width:18px;text-align:center}
main{flex:1;padding:20px;max-width:1400px;width:100%;margin:0 auto}
h2{font-size:17px;margin:22px 0 12px;font-weight:800;display:flex;align-items:center;gap:10px}
h2::before{content:'';width:5px;height:20px;border-radius:3px;background:linear-gradient(180deg,var(--ac),var(--ac2))}
h3{font-size:15px;margin:12px 0 8px;font-weight:800}
.card{background:color-mix(in srgb,var(--card) var(--co),transparent);backdrop-filter:blur(var(--cb));border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 12px 28px -14px #0008;transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{border-color:color-mix(in srgb,var(--ac) 40%,var(--line));transform:translateY(-3px);box-shadow:0 22px 40px -18px #000b}
.card.big{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 45%,#000));color:#fff;border:0}
.card.big .m{color:#fffc}
.card.stat{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--card) 82%,var(--ac)))}
.card.stat::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.card.stat b{font-size:26px;display:block;font-weight:800;letter-spacing:-.02em;margin:4px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.m{color:var(--mute);font-size:13px}
.m.sm{font-size:11.5px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tag{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--line);font-weight:700;color:var(--ink)}
.t-Available,.t-Closed,.t-Active,.t-Paid{background:#dcfce7;color:#166534}
.t-Sold,.t-Lost,.t-Left,.t-Cancelled,.t-Inactive,.t-Offline{background:#fee2e2;color:#991b1b}
.t-Hold,.t-Negotiation,.t-Pending,.t-Overdue{background:#fef3c7;color:#92400e}
.t-New,.t-Follow-up,.t-Contacted,.t-Visit,.t-Online{background:#dbeafe;color:#1e40af}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;font-size:14px;transition:.15s}
button:hover{border-color:var(--ac);box-shadow:0 6px 14px -6px #0006}
button:active{transform:translateY(2px)}
button.p{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 88%,#fff),var(--ac));color:#fff;border-color:var(--ac)}
button.d{background:linear-gradient(180deg,color-mix(in srgb,var(--bad) 88%,#fff),var(--bad));color:#fff;border-color:var(--bad)}
button.sm{padding:6px 12px;font-size:12.5px}
button.xs{padding:4px 9px;font-size:11.5px}
input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;transition:.15s;margin:4px 0 10px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
textarea{resize:vertical;min-height:70px}
label{font-size:12.5px;color:var(--mute);font-weight:600;display:block;margin-top:6px;text-transform:uppercase;letter-spacing:.04em}
input[type=checkbox],input[type=radio]{width:auto;margin-right:6px;accent-color:var(--ac)}
input[type=range]{padding:0;background:none;border:0;box-shadow:none;accent-color:var(--ac)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.filters input,.filters select{margin:0}
.chk-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500}
.chk-row input{width:auto;margin:0;accent-color:var(--ac)}
.list-item{background:color-mix(in srgb,var(--card) var(--co),transparent);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.2s;display:flex;gap:14px;align-items:center}
.list-item:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 16px 28px -14px #0009}
.list-item.selected{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.list-item .cb{width:22px;height:22px;accent-color:var(--ac);flex:none;cursor:pointer;margin:0}
.list-item .body{flex:1;min-width:0}
.list-item .title{font-weight:800;font-size:15px;margin-bottom:4px}
.list-item .meta{font-size:13px;color:var(--mute);line-height:1.5}
.list-item .side{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.list-item .thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--line);flex:none}
.bulk-bar{position:sticky;top:70px;z-index:10;background:var(--card);border:1px solid var(--ac);border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 24px -8px #0009}
.bulk-bar .count{font-weight:800;font-size:15px;color:var(--ac)}
.av{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));flex:none;position:relative}
.av.lg{width:56px;height:56px;font-size:22px}
.av.sm{width:32px;height:32px;font-size:13px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:5px;transition:width .5s}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.modal-box{background:var(--bg);border-radius:20px;padding:24px;max-width:620px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 40px 80px -20px #000c;animation:up .3s;border:1px solid var(--line)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px) scale(.96);opacity:0}}
.detail-hero{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 45%,#000));color:#fff;border-radius:14px;padding:20px;margin:-4px -4px 16px}
.detail-hero .badge-top{background:rgba(255,255,255,.22);font-size:11px;padding:3px 10px;border-radius:99px;font-weight:700;text-transform:uppercase}
.detail-hero h2{color:#fff;margin:10px 0 4px;font-size:22px}
.detail-hero h2::before{display:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.kv>div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kv span{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:4px}
.kv b{font-size:14.5px;font-weight:700;word-break:break-word}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--ac);color:#fff;padding:13px 26px;border-radius:99px;font-weight:700;transition:.3s;opacity:0;z-index:9999;box-shadow:0 12px 26px -6px #0009;font-size:14px}
#toast.show{transform:translate(-50%,0);opacity:1}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.auth-card{max-width:440px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 30px 60px -20px #000a;animation:up .5s}
.auth-card h1{font-size:24px;font-weight:800;margin:14px 0 6px;letter-spacing:-.02em}
.auth-logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:8px;overflow:hidden}
.auth-logo img{width:100%;height:100%;object-fit:cover}
.auth-tabs{display:flex;gap:6px;margin:16px 0 12px;background:var(--bg);padding:4px;border-radius:12px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:10px;font-size:13.5px;border-radius:8px}
.auth-tabs button.on{background:var(--card);box-shadow:0 4px 10px -4px #0004;color:var(--ac);font-weight:800}
.theme-picker{display:flex;gap:8px;flex-wrap:wrap}
.theme-dot{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0;transition:.2s}
.theme-dot:hover{transform:scale(1.15)}
.theme-dot.on{border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 30%,transparent)}
.staff-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.staff-row .info{flex:1}
.staff-row .stats{display:flex;gap:16px;text-align:center}
.staff-row .stats b{display:block;font-size:18px;font-weight:800;color:var(--ac)}
.staff-row .stats span{font-size:11px;color:var(--mute);text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{background:color-mix(in srgb,var(--ac) 6%,var(--card));font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:800}
.range-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:color-mix(in srgb,var(--ac) 6%,var(--card));border:1px solid color-mix(in srgb,var(--ac) 20%,var(--line));border-radius:12px;margin-bottom:12px}
.range-bar button{padding:6px 12px;font-size:12.5px;border-radius:8px}
.range-bar button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.range-bar input[type=date]{width:auto;margin:0;padding:7px 10px;font-size:12.5px}
.step-ind{display:flex;gap:6px;align-items:center;margin-bottom:14px;justify-content:center}
.step-ind div{width:30px;height:4px;background:var(--line);border-radius:2px}
.step-ind div.on{background:var(--ac)}
@media(max-width:899px){.content{margin-left:0}#sb{transform:translateX(-105%);width:280px}.shell.open #sb{transform:none}.hb{display:inline-flex}.kv{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.range-bar{overflow-x:auto}}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block}}
</style>

<script>
/* ===== FREE CLOUD SYNC (Google Apps Script + Drive) ===== */
(function(){const P=new URLSearchParams(location.search),t=(P.get('t')||'').toLowerCase();
if(P.get('fb'))localStorage.setItem('dp_fb',P.get('fb').replace(/\/$/,''));
const base=(localStorage.getItem('dp_fb')||'').replace(/\/$/,'');
window.SRV={base:base,ok:false,t:t};if(!base)return;
const _s=Storage.prototype.setItem,san=s=>String(s||'').replace(/[^A-Za-z0-9]/g,'');
let pass=sessionStorage.getItem('dp_adm')||'';
const X=(m,p)=>{const x=new XMLHttpRequest();x.open('GET',base+(base.indexOf('?')>0?'&':'?')+'p='+encodeURIComponent(p),false);try{x.send()}catch(e){return null}try{return x.status===200?JSON.parse(x.responseText):null}catch(e){return null}};
const strip=(pj,s)=>{try{const p=JSON.parse(pj),o=(p.tenants||{})[s];return JSON.stringify({supers:{},tenants:o?{[s]:o}:{},cloud:{}})}catch(e){return null}};
try{
 const out={};
 if(t){const c=X('GET','/c/'+t);if(c)Object.assign(out,c);const pb=X('GET','/pub/'+t);if(pb)out.dp_platform=pb;SRV.ok=true}
 else{if(!pass){pass=san(prompt('Cloud passphrase (sirf Super Admin ke liye: koi bhi secret lafz, yaad rakhein; dubara wahi daalna hoga). Cancel = offline'));sessionStorage.setItem('dp_adm',pass)}
  if(pass){SRV.ok=true;const a=X('GET','/adm/'+pass);if(a&&a.dp_platform){out.dp_platform=a.dp_platform;try{Object.keys(JSON.parse(a.dp_platform).tenants||{}).forEach(s=>{const c=X('GET','/c/'+s);if(c)Object.assign(out,c)})}catch(e){}}}}
 Object.keys(out).forEach(k=>_s.call(localStorage,k,out[k]));
}catch(e){}
if(!SRV.ok)return;

}

async function start2FA(session){

  const code=genCode();
  LS('dp_2fa',{u:session.u,type:session.type,slug:session.slug||'',code,at:Date.now(),tries:0});

  const sent=await sendEmail(email,'Login Verification Code — Sach CRM',`Assalam o Alaikum,\n\nAap ka login verification code yeh hai:\n\n${code}\n\nYeh code 10 minute tak valid hai.\n\nAgar aap ne login nahi kiya to ignore karein.\n\nSach CRM`);

  $('#app').innerHTML=`<div class="auth-wrap"><div class="auth-card">
    <div class="step-ind"><div class="on"></div><div class="on"></div></div>
    <div class="auth-logo">📧</div>

    <p class="m">Aap ke email <b>${esc(email)}</b> par 6-digit code bheja gaya hai.</p>
    ${sent.demo?`<div style="background:var(--ac);color:#fff;padding:14px;border-radius:10px;text-align:center;font-size:26px;font-weight:800;letter-spacing:.3em;margin:12px 0">${code}</div>
    <p class="m sm" style="margin-bottom:8px">⚠️ Demo mode: EmailJS configured nahi, isliye code yahan dikh raha hai. Settings → Email mein setup karein.</p>`:'<p class="m" style="margin-bottom:12px">Email check karein aur code daalein.</p>'}
    <label>Verification code</label>
    <input id="code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" style="text-align:center;font-size:22px;font-weight:800;letter-spacing:.5em;padding:14px">
    <p class="bad" id="err" style="margin:8px 0;font-weight:700"></p>
    <button class="p" style="width:100%;padding:14px;font-size:15px" id="go">Verify & Sign In →</button>
    <p style="text-align:center;margin-top:12px"><a href="#" id="resend" style="color:var(--ac);font-size:13px">Resend code</a> · <a href="#" id="back" style="color:var(--mute);font-size:13px;margin-left:8px">← Back</a></p>
  </div></div>`;
  setTimeout(()=>$('#code').focus(),100);
  $('#go').onclick=()=>{
    const c=$('#code').value.trim();
    const stored=LS('dp_2fa');
    if(!stored){$('#err').textContent='Session expired';return}
    if(Date.now()-stored.at>10*60*1000){$('#err').textContent='Code expired';return}
    if(c!==stored.code){
      stored.tries=(stored.tries||0)+1;
      LS('dp_2fa',stored);
      if(stored.tries>=3){LSW('dp_2fa',null);$('#err').textContent='Too many wrong attempts. Login again.';setTimeout(authView,1500);return}
      $('#err').textContent='Wrong code ('+(3-stored.tries)+' tries left)';return;
    }
    LSW('dp_2fa',null);
    finishLogin(session);
  };
  $('#code').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
  $('#resend').onclick=e=>{e.preventDefault();start2FA(session)};
  $('#back').onclick=e=>{e.preventDefault();authView()};
}

  if(session.type==='super'){
    LSW('dp_sess',session.u);LSW('dp_super','1');
    setSuper(true);U=session.u;ROLE='super';msg='';
    superHome();return;
  }
  const users=usersOf(session.slug);
  LS(uKey(session.slug),users);
  LS('dp_users',users);
  LSW('dp_sess',session.u);
  setTenant(session.slug);setSuper(false);
  U=session.u;ROLE=users[session.u].role||'staff';
  D=dataOf(session.slug);D.set=Object.assign({co:p.tenants[session.slug].name},D.set);
  D.staff=D.staff||{};
  D.staff[session.u]=Object.assign(D.staff[session.u]||{},{online:true,lastSeen:nowISO(),calls:(D.staff[session.u]&&D.staff[session.u].calls)||0,wa:(D.staff[session.u]&&D.staff[session.u].wa)||0,logins:((D.staff[session.u]&&D.staff[session.u].logins)||0)+1});
  logAct('Login','Signed in (2FA)');
  if(TENANT)LS(tKey(TENANT),D);
  heartBeat();
  mainApp();
  toast('Welcome '+session.u);
}

/* ===== FORGOT PASSWORD ===== */
function forgotPassword(tenantSlug){
  $('#app').innerHTML=`<div class="auth-wrap"><div class="auth-card">
    <div class="auth-logo">🔑</div>
    <h1>Forgot Password</h1>
    <p class="m">Apna username aur registered email daalein.</p>
    <label>Username</label><input id="fu">
    <label>Email</label><input id="fe" type="email">
    <p class="bad" id="err" style="margin:8px 0;font-weight:700"></p>
    <button class="p" style="width:100%;padding:14px" id="go">Send Reset Code →</button>
    <p style="text-align:center;margin-top:14px"><a href="#" id="back" style="color:var(--mute);font-size:13px">← Back</a></p>
  </div></div>`;
  $('#back').onclick=e=>{e.preventDefault();authView()};
  $('#go').onclick=async()=>{
    const u=$('#fu').value.trim().toLowerCase(),em=$('#fe').value.trim();
    if(!u||!em){$('#err').textContent='Both fields required';return}
    const users=usersOf(tenantSlug)||LS('dp_users')||{};
    if(!users[u]||users[u].email!==em){$('#err').textContent='Username or email mismatch';return}
    const code=genCode();
    LS('dp_reset_'+u,{code,em,at:Date.now()});
    const sent=await sendEmail(em,'Password Reset Code',`Aap ka reset code: ${code}\n10 minute valid.`);
    $('#app').innerHTML=`<div class="auth-wrap"><div class="auth-card">
      <div class="auth-logo">🔐</div>
      <h1>Reset Password</h1>
      ${sent.demo?`<div style="background:var(--ac);color:#fff;padding:14px;border-radius:10px;text-align:center;font-size:28px;font-weight:800;letter-spacing:.3em;margin:12px 0">${code}</div><p class="m sm" style="margin-bottom:8px">Demo mode (EmailJS configured nahi).</p>`:'<p class="m">Email check karein.</p>'}
      <label>Code</label><input id="code" maxlength="6" style="text-align:center;font-size:20px;font-weight:800;letter-spacing:.5em">
      <label>New password</label><input id="np" type="password">
      <label>Confirm password</label><input id="np2" type="password">
      <p class="bad" id="err2" style="margin:8px 0;font-weight:700"></p>
      <button class="p" style="width:100%;padding:14px" id="do">Reset →</button>
    </div></div>`;
    $('#do').onclick=async()=>{
      const c=$('#code').value.trim(),np=$('#np').value,np2=$('#np2').value;
      const stored=LS('dp_reset_'+u);
      if(!stored||stored.code!==c){$('#err2').textContent='Wrong code';return}
      if(Date.now()-stored.at>15*60*1000){$('#err2').textContent='Expired';return}
      if(np.length<4){$('#err2').textContent='Password 4+';return}
      if(np!==np2){$('#err2').textContent='Mismatch';return}
      users[u].h=await hash(u+':'+np);
      if(tenantSlug){LS(uKey(tenantSlug),users);const pp=loadPlat();if(pp.tenants[tenantSlug])pp.tenants[tenantSlug].users=users;savePlat(pp)}
      else LS('dp_users',users);
      LS('dp_users',users);
      LSW('dp_reset_'+u,null);
      msg='Password reset. Please sign in.';
      authView();
    };
  };
}

function switchPasswordPrompt(a){
  const m=el('div','modal');
  m.innerHTML=`<div class="modal-box" style="max-width:420px">
    <div style="text-align:center;margin-bottom:14px">
      <div class="av lg" style="margin:0 auto 12px">${esc(a.u.charAt(0).toUpperCase())}</div>
      <h2 style="margin:0;justify-content:center">${esc(a.u)}</h2>
    </div>
    <label>Password</label><input id="pw" type="password">
    <p class="bad" id="err"></p>
    <div class="row" style="gap:8px">
      <button class="p" id="ok" style="flex:1">🔓 Unlock</button>
      <button id="cn">Cancel</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.querySelector('#cn').onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)m.remove()};
  const attempt=async()=>{
    const pw=m.querySelector('#pw').value;
    if(!pw){m.querySelector('#err').textContent='Password required';return}
    const p=loadPlat();
    const h=await hash(a.u+':'+pw);
    if(a.type==='super'){
      if(!p.supers[a.u]||p.supers[a.u].h!==h){m.querySelector('#err').textContent='Wrong';return}
      m.remove();
      start2FA({type:'super',u:a.u,pw});
    } else {
      const users=usersOf(a.slug);
      if(!users[a.u]||users[a.u].h!==h){m.querySelector('#err').textContent='Wrong';return}
      if(users[a.u].status==='inactive'){m.querySelector('#err').textContent='Account inactive';return}
      m.remove();
      start2FA({type:'company',slug:a.slug,u:a.u,pw});
    }
  };
  m.querySelector('#ok').onclick=attempt;
  m.querySelector('#pw').onkeydown=e=>{if(e.key==='Enter')attempt()};

/* ============================================================
   BOOT + HEARTBEAT
   ============================================================ */
function boot(u){
  U=u;
  ROLE=(LS('dp_users')||{})[u]?.role||'staff';
  document.onkeydown=null;
  if(!D)D=Object.assign(emptyData(),LS('dp_data')||{});
  D.set=Object.assign({co:'Sach Marketing.Pk'},D.set);
  D.staff=D.staff||{};
  D.staff[u]=Object.assign(D.staff[u]||{},{online:true,lastSeen:nowISO(),calls:D.staff[u]?.calls||0,wa:D.staff[u]?.wa||0});
  heartBeat();
  mainApp();
}

function heartBeat(){
  if(!D||!U)return;
  D.staff=D.staff||{};
  D.staff[U]=Object.assign(D.staff[U]||{},{online:true,lastSeen:nowISO(),calls:D.staff[U]?.calls||0,wa:D.staff[U]?.wa||0,logins:D.staff[U]?.logins||0});
  if(TENANT)LS(tKey(TENANT),D);
  clearInterval(heartBeat._h);
  heartBeat._h=setInterval(()=>{
    if(!D||!U)return;
    D.staff[U]=Object.assign(D.staff[U]||{},{online:true,lastSeen:nowISO()});
    if(TENANT)LS(tKey(TENANT),D);
  },20000);
  window.addEventListener('beforeunload',()=>{
    if(D&&U){D.staff[U]=Object.assign(D.staff[U]||{},{online:false,lastSeen:nowISO()});if(TENANT)LS(tKey(TENANT),D)}
  });
}

/* ===== RENDER ===== */
function render(){
  if(window.IS_SUPER&&!window.TENANT){superHome();return}
  if(!U||!D){authView();return}

  const t=today();
  const fuN=D.C.filter(c=>c.fu&&c.fu<=t&&!['Closed','Lost'].includes(c.status)).length;
  const alertsN=alerts().length;

  let sbItems='';
  NAV.forEach(([k,ic,label,subs])=>{
    // Permission check for whole section
    const permMap={dashboard:null,reports:'view_reports',inventory:null,listings:'view_listings',clients:'view_clients',followup:'view_clients',sources:'view_clients',deals:'view_deals',commission:'view_deals',vendors:null,money:'view_money','office-exp':'view_money','house-exp':'view_money',budget:'view_money',hr:'view_hr',attendance:'view_hr',advance:'view_hr','staff-monitor':'view_staff_monitor','staff-activity':'view_all_logs',settings:'view_settings'};
    const needPerm=permMap[k];
    if(needPerm&&!hasPerm(needPerm)&&ROLE!=='admin'&&ROLE!=='super')return;

    const isActive=tab===k||subs.some(s=>s[0]===tab);
    const hasSub=subs.length>0;
    const isOpen=isActive||(q.nav&&q.nav[k]);
    sbItems+=`<div class="sb-item ${isActive?'on':''}" data-nav="${k}">
      <span class="ic">${ic}</span><span>${label}</span>
      ${hasSub?'<span class="arrow">›</span>':''}
    </div>`;
    if(hasSub){
      sbItems+=`<div class="sub ${isOpen?'open':''}" data-sub="${k}">${subs.map(([sk,sl])=>{
        const sp=permMap[sk];
        if(sp&&!hasPerm(sp)&&ROLE!=='admin'&&ROLE!=='super')return '';
        return `<div class="sub-item ${tab===sk?'on':''}" data-tab="${sk}">${sl}</div>`;
      }).join('')}</div>`;
    }
  });

  const logoHtml=D.set.logo?`<img src="${D.set.logo}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`:'🏢';

  $('#app').innerHTML=`
    <div class="shell">
      <aside id="sb">
        <div class="sb-head">
          <div class="sb-logo">${logoHtml}</div>
          <span class="sb-brand">${esc(D.set.co||'Sach CRM')}</span>
          <span class="act-badge">${ROLE==='admin'?'ADMIN':ROLE==='super'?'SUPER':'STAFF'}</span>
        </div>
        <div class="sb-body">${sbItems}</div>
        <div class="sb-foot" id="userMenu">
          <div class="av" style="position:relative">
            ${esc((U||'?').charAt(0).toUpperCase())}
            <span class="${D.staff&&D.staff[U]&&D.staff[U].online?'dot-online':'dot-offline'}"></span>
          </div>
          <span>${esc(U)}</span>
        </div>
      </aside>
      <div class="content">
        <header>
          <button class="hb" id="hb">☰</button>
          <h1 class="page-title">${TTL[tab]||'Dashboard'}</h1>
          <div class="gs-wrap">
            <input class="gs" id="gs" placeholder="Search listings, clients, vendors…" autocomplete="off">
            <div class="gsd" id="gsd"></div>
          </div>
          <div class="hbtns">
            <button class="hbtn" id="asw" title="Switch">🔄</button>
            <button class="hbtn" id="bell" title="Alerts">🔔${alertsN?'<span class="badge">'+alertsN+'</span>':''}</button>
            <button class="hbtn" id="thm" title="Theme">🎨</button>
            <button class="hbtn p" id="svb" title="Save">💾</button>
            <button class="hbtn d" id="lo" title="Sign out">⎋</button>
          </div>
        </header>
        <main id="view"></main>
      </div>
    </div>`;

  $$('[data-nav]').forEach(x=>x.onclick=()=>{
    const k=x.dataset.nav;
    const nav=NAV.find(n=>n[0]===k);
    if(nav&&nav[3]&&nav[3].length>0){
      const isOpen=x.nextElementSibling&&x.nextElementSibling.classList.contains('open');
      (q.nav=q.nav||{})[k]=!isOpen;
      x.classList.toggle('open');
      const sub=x.nextElementSibling;
      if(sub&&sub.classList.contains('sub'))sub.classList.toggle('open');
    } else { tab=k;render(); }
  });
  $$('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;render();if(innerWidth<900)$('.shell').classList.remove('open')});
  $('#hb').onclick=()=>$('.shell').classList.toggle('open');
  $('#asw').onclick=accountSwitcher;
  $('#bell').onclick=showAlerts;
  $('#thm').onclick=showThemePicker;
  $('#svb').onclick=()=>{save();render()};
  $('#lo').onclick=()=>{if(confirm('Sign out?')){D.staff[U]=Object.assign(D.staff[U]||{},{online:false,lastSeen:nowISO()});logAct('Logout','Signed out');if(TENANT)LS(tKey(TENANT),D);LSW('dp_sess',null);LSW('dp_super',null);authView()}};
  $('#userMenu').onclick=()=>showUserMenu();

  const gs=$('#gs');
  gs.oninput=gs.onfocus=()=>globalSearch(gs.value.trim());
  gs.onblur=()=>setTimeout(()=>$('#gsd').classList.remove('on'),200);

  const view=$('#view');
  const FN=V[tab];
  if(FN)view.innerHTML=FN();
  else view.innerHTML='<div class="card"><p class="m">Coming soon</p></div>';
  bindView();
}

/* ===== GLOBAL SEARCH ===== */
function globalSearch(v){
  const dd=$('#gsd');
  if(!v){dd.classList.remove('on');return}
  const k=v.toLowerCase();
  const results=[];
  D.L.forEach(l=>{if([l.type,l.society,l.size,l.owner,l.ophone].some(x=>String(x||'').toLowerCase().includes(k)))results.push({ic:'🏘️',title:l.type+' • '+l.society,sub:l.size+' • '+fmt(l.price),fn:()=>detail('listings',l.id)})});
  D.C.forEach(c=>{if([c.name,c.phone,c.society,c.source].some(x=>String(x||'').toLowerCase().includes(k)))results.push({ic:'👤',title:c.name,sub:c.phone+' • '+c.status,fn:()=>detail('clients',c.id)})});
  D.V.forEach(x=>{if([x.name,x.phone,x.cat].some(y=>String(y||'').toLowerCase().includes(k)))results.push({ic:'🏷️',title:x.name,sub:x.cat,fn:()=>detail('vendors',x.id)})});
  D.H.forEach(h=>{if([h.name,h.role,h.phone].some(y=>String(y||'').toLowerCase().includes(k)))results.push({ic:'👔',title:h.name,sub:h.role,fn:()=>detail('hr',h.id)})});
  Object.entries(D.staff||{}).forEach(([u,s])=>{if(u.toLowerCase().includes(k))results.push({ic:'👨‍💼',title:u,sub:s.online?'🟢 Online':'⚫ '+timeAgo(s.lastSeen),fn:()=>{tab='staff-monitor';render()}})});

  dd.innerHTML=results.slice(0,10).map((r,i)=>`<div class="gsd-item" data-gsi="${i}"><span style="font-size:20px">${r.ic}</span><div><div style="font-weight:700">${esc(r.title)}</div><div class="subtxt">${esc(r.sub||'')}</div></div></div>`).join('')||'<div class="gsd-item"><span>🔍</span><div class="m">No results</div></div>';
  dd.classList.add('on');
  dd.querySelectorAll('[data-gsi]').forEach(x=>x.onclick=()=>{dd.classList.remove('on');$('#gs').value='';results[x.dataset.gsi].fn()});
}

/* ===== ALERTS ===== */
function alerts(){
  if(!D||!U)return [];
  const A=[],t=today(),mk=t.slice(0,7);
  D.C.filter(c=>c.fu&&!['Closed','Lost'].includes(c.status)).forEach(c=>{
    if(c.fu<=t)A.push({k:'fu'+c.id+c.fu,lv:c.fu<t?'bad':'warn',ic:'📞',t:(c.fu<t?'Overdue: ':'Today: ')+c.name,s:'Due '+c.fu,go:()=>detail('clients',c.id)});
  });
  [['office',D.budget],['house',D.hbudget]].forEach(([k,b])=>{
    if(!b)return;
    const sp=D.E.filter(e=>(e.kind||'office')===k&&(e.date||'').startsWith(mk)).reduce((s,e)=>s+(+e.amount||0),0);
    if(sp>b)A.push({k:'bud'+k+mk,lv:'bad',ic:'🚨',t:k+' budget exceeded',s:'Over by '+fmt(sp-b),go:()=>{tab=k==='office'?'office-exp':'house-exp';render()}});
  });
  return A;
}
function showAlerts(){
  const A=alerts();
  const m=el('div','modal');
  m.innerHTML=`<div class="modal-box">
    <h2 style="margin-top:0">🔔 Alerts (${A.length})</h2>
    ${A.map((a,i)=>`<div class="card row" style="cursor:pointer;padding:12px;margin-bottom:8px;border-left:4px solid ${a.lv==='bad'?'var(--bad)':'var(--warn)'}" data-al="${i}">
      <span style="font-size:22px">${a.ic}</span>
      <div style="flex:1"><b>${esc(a.t)}</b><br><span class="m">${esc(a.s)}</span></div>
    </div>`).join('')||'<p class="m">✅ All good!</p>'}
    <button id="cl" style="width:100%;margin-top:12px">Close</button>
  </div>`;
  document.body.appendChild(m);
  m.querySelector('#cl').onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)m.remove()};
  m.querySelectorAll('[data-al]').forEach(r=>r.onclick=()=>{m.remove();A[r.dataset.al].go()});
}

/* ===== DATE RANGE BAR ===== */
function rangeBar(scope){
  loadRange(scope);
  const cur=RANGE.key;
  const inputs=cur==='custom'?('<input type="date" id="rfrom" value="'+(RANGE.from||today())+'"><span class="m">to</span><input type="date" id="rto" value="'+(RANGE.to||today())+'">'):'';
  const btns=RANGE_LABELS.map(function(r){return '<button class="'+(cur===r[0]?'on':'')+'" data-range="'+r[0]+'" data-scope="'+scope+'">'+r[1]+'</button>'}).join('');
  return '<div class="range-bar"><b style="font-size:12.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em">📅 Date Range:</b>'+btns+inputs+'</div>';

/* ===== FORMS ===== */
function form(title,fields,v,onSave,onDel){
  v=v||{};
  const m=el('div','modal');
  m.innerHTML=`<div class="modal-box">
    <h2 style="margin-top:0">${esc(title)}</h2>
    ${fields.map(([k,l,t,o])=>{
      const val=v[k]??'';
      if(t==='select')return `<label>${esc(l)}</label><select data-k="${k}">${o.map(x=>{const a=Array.isArray(x)?x:[x,x];return `<option value="${esc(a[0])}" ${String(a[0])===String(val)?'selected':''}>${esc(a[1])}</option>`}).join('')}</select>`;
      if(t==='textarea')return `<label>${esc(l)}</label><textarea data-k="${k}" rows="3">${esc(val)}</textarea>`;
      if(t==='number')return `<label>${esc(l)}</label><input type="number" data-k="${k}" value="${esc(val)}">`;
      if(t==='date')return `<label>${esc(l)}</label><input type="date" data-k="${k}" value="${esc(val)}">`;
      return `<label>${esc(l)}</label><input type="${t||'text'}" data-k="${k}" value="${esc(val)}">`;
    }).join('')}
    <div class="row" style="margin-top:16px;gap:8px">
      <button class="p" id="ok" style="flex:1">💾 Save</button>
      <button id="cn">Cancel</button>
      ${onDel?'<button class="d" id="dl">🗑</button>':''}
    </div>
  </div>`;
  document.body.appendChild(m);
  m.querySelector('#cn').onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)m.remove()};
  m.querySelector('#ok').onclick=()=>{
    const o={...v};
    m.querySelectorAll('[data-k]').forEach(el=>{let val=el.value;if(el.type==='number')val=val===''?'':+val;o[el.dataset.k]=val});
    m.remove();onSave(o);
  };
  if(onDel)m.querySelector('#dl').onclick=()=>{if(confirm('Delete permanently?')){m.remove();onDel()}};
  const fi=m.querySelector('input:not([type=file]),textarea,select');if(fi)setTimeout(()=>fi.focus(),50);
}

const upsert=(a,o,act)=>{
  if(o.id){const i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.unshift(o)}
  else{o.id=uid();o.at=nowISO();a.unshift(o)}
  logAct(act||'Update',o.name||o.title||o.type||o.id);
  save();render();
};
const del=(a,id,act)=>{
  const i=a.findIndex(x=>x.id===id);
  if(i>=0)a.splice(i,1);
  logAct(act||'Delete',id);
  save();render();
};

const matches=c=>D.L.filter(l=>l.status==='Available'&&(!c.ptype||c.ptype==='Any'||l.type===c.ptype)&&(!c.budget||l.price<=c.budget*1.1)&&(!c.society||(l.society||'').toLowerCase().includes(c.society.toLowerCase()))).sort((a,b)=>a.price-b.price);

    <div class="body">

    </div>
    <div class="side">
      ${opt.side||''}
      ${opt.actions||''}
    </div>
  </div>`;
}

function filterMatch(o,range){
  const k=(q.ls||q.cs||'').toLowerCase();
  if(k&&![o.name,o.society,o.owner,o.size,o.type,o.phone,o.ophone].some(x=>String(x||'').toLowerCase().includes(k)))return false;
  if(range&&!inRange(o.at||o.date,range.from,range.to))return false;
  return true;
}

V['office-exp']=()=>expenseView('office');
V['house-exp']=()=>expenseView('house');
function expenseView(k){
  const rg=currentRange();
  const cs=k==='office'?OC:HC;
  const L=D.E.filter(e=>(e.kind||'office')===k&&inRange(e.date,rg.from,rg.to));
  const spent=L.reduce((s,e)=>s+(+e.amount||0),0);
  const bud=k==='office'?D.budget:D.hbudget;
  const byCat=cs.map(c=>[c,L.filter(e=>e.cat===c).reduce((s,e)=>s+(+e.amount||0),0)]).filter(x=>x[1]>0);
  const maxC=Math.max(1,...byCat.map(x=>x[1]));
  return `
    <div class="row between">
      <h2 style="margin:0">${k==='office'?'🏢':'🏠'} ${k==='office'?'Office':'House'} Expenses</h2>
      ${hasPerm('add_money')?`<button class="p" id="add" data-kind="${k}">+ New</button>`:''}
    </div>
    ${rangeBar(k+'-exp')}
    <div class="grid4">
      <div class="card stat"><span class="m">In Range</span><b class="bad">${fmt(spent)}</b></div>
      <div class="card stat"><span class="m">Budget</span><b>${bud?fmt(bud):'Not set'}</b></div>
      <div class="card stat"><span class="m">Remaining</span><b class="${bud&&spent>bud?'bad':'ok'}">${bud?fmt(bud-spent):'-'}</b></div>
      <div class="card stat"><span class="m">Entries</span><b>${L.length}</b></div>
    </div>
    <h2>By Category</h2>
    <div class="card">${byCat.map(c=>`<div style="margin:8px 0"><div class="row m"><span>${esc(c[0])}</span><b>${fmt(c[1])}</b></div><div class="bar"><i style="width:${c[1]/maxC*100}%"></i></div></div>`).join('')||'<p class="m">No expenses in range</p>'}</div>
    <h2>All Entries</h2>
    ${L.map(e=>`<div class="list-item" data-e="${e.id}" data-type="E">
      <div class="body"><div class="title">${esc(e.title)}</div><div class="meta">📅 ${e.date} • ${esc(e.cat)}</div></div>
      <div class="side"><b class="bad">${fmt(e.amount)}</b></div>
    </div>`).join('')||'<div class="card"><p class="m">No entries</p></div>'}
    <div class="row" style="margin-top:14px"><button id="setBud">Set ${k} budget</button></div>
  `;
}

/* ============================================================
   BIND VIEW EVENTS
   ============================================================ */
function bindView(){
  const v=$('#view');

  v.querySelectorAll('[data-qa]').forEach(b=>b.onclick=()=>({c:cForm,l:lForm,d:dForm,e:eForm})[b.dataset.qa]());

  const add=v.querySelector('#add');
  if(add)add.onclick=()=>{
    const k=add.dataset.kind||tab;
    if(tab==='listings')lForm();
    else if(tab==='clients')cForm();
    else if(tab==='deals'||tab==='commission')dForm();
    else if(tab==='vendors')vForm();
    else if(tab==='hr')hForm();
    else if(k==='office')eForm(null,'office');
    else if(k==='house')eForm(null,'house');
  };

  // Range bar
  v.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{
    loadRange(b.dataset.scope);
    RANGE.key=b.dataset.range;
    saveRange(b.dataset.scope);
    render();
  });
  const rfrom=v.querySelector('#rfrom'),rto=v.querySelector('#rto');
  if(rfrom)rfrom.onchange=()=>{RANGE.from=rfrom.value;RANGE.key='custom';saveRange(document.querySelector('[data-scope]')?.dataset.scope||'listings');render()};
  if(rto)rto.onchange=()=>{RANGE.to=rto.value;RANGE.key='custom';saveRange(document.querySelector('[data-scope]')?.dataset.scope||'listings');render()};

  // Add commission (separate)
  const addComm=v.querySelector('#addComm');
  if(addComm)addComm.onclick=()=>dForm();
  v.querySelectorAll('[data-recv]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const d=D.Dl.find(x=>x.id===b.dataset.recv);
    if(!d)return;
    form('Add Payment Received',[['amt','Amount (PKR)','number']],{amt:d.recv||0},o=>{
      d.recv=(+d.recv||0)+(+o.amt||0);
      logAct('Commission Payment','+'+fmt(o.amt));
      save();render();
    });
  });

  // Advance add
  const addAdv=v.querySelector('#addAdv');
  if(addAdv)addAdv.onclick=()=>advanceForm();
  v.querySelectorAll('[data-deladv]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    if(!confirm('Delete advance?'))return;
    D.Adv=D.Adv.filter(a=>a.id!==b.dataset.deladv);
    save();render();
  });

  // Attendance mark
  v.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>markAttendance(b.dataset.mark));

  // Items
  v.querySelectorAll('.list-item[data-e]').forEach(e=>{
    e.onclick=ev=>{
      if(ev.target.closest('button')||ev.target.closest('a')||ev.target.closest('input'))return;
      if(SEL.on)return;
      detail(e.dataset.type||mapTypeToTab(tab),e.dataset.e);
    };
  });
  v.querySelectorAll('.card[data-e]').forEach(e=>{
    e.onclick=ev=>{if(ev.target.closest('button'))return;detail(mapTypeToTab(tab),e.dataset.e)};
  });

  // Filters
  v.querySelectorAll('[data-q]').forEach(i=>{
    i.oninput=i.onchange=()=>{
      q[i.dataset.q]=i.value;
      const p=i.selectionStart,focused=i.dataset.q;
      render();
      const n=document.querySelector(`[data-q="${focused}"]`);
      if(n&&n.tagName==='INPUT'){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}
    };
  });

  v.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{q.view=b.dataset.v;render()});

  // Bulk
  const es=v.querySelector('#enterSel');if(es)es.onclick=()=>{SEL.on=true;SEL.ids.clear();render()};
  const ex=v.querySelector('#exitSel');if(ex)ex.onclick=()=>{SEL.on=false;SEL.ids.clear();render()};
  const sa=v.querySelector('#selAll');if(sa)sa.onclick=()=>{v.querySelectorAll('.list-item[data-e]').forEach(x=>SEL.ids.add(x.dataset.e));render()};
  const sn=v.querySelector('#selNone');if(sn)sn.onclick=()=>{SEL.ids.clear();render()};
  const ds=v.querySelector('#delSel');if(ds)ds.onclick=()=>{
    if(!SEL.ids.size)return;
    if(!confirm('Delete '+SEL.ids.size+' items?'))return;
    const arr=tab==='listings'?D.L:tab==='clients'?D.C:tab==='deals'||tab==='commission'?D.Dl:tab==='vendors'?D.V:D.E;
    [...SEL.ids].forEach(id=>{const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1)});
    logAct('Bulk Delete',SEL.ids.size+' items');
    SEL.ids.clear();SEL.on=false;save();render();
  };
  v.querySelectorAll('[data-sel]').forEach(cb=>cb.onchange=()=>{if(cb.checked)SEL.ids.add(cb.dataset.sel);else SEL.ids.delete(cb.dataset.sel);render()});

  // Call/WA
  v.querySelectorAll('[data-call]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const c=D.C.find(x=>x.id===b.dataset.call);
    if(!c||!c.phone)return;
    D.staff=D.staff||{};D.staff[U]=D.staff[U]||{calls:0,wa:0};
    D.staff[U].calls=(D.staff[U].calls||0)+1;D.staff[U].lastSeen=nowISO();
    logAct('Call','Called '+c.name);
    save();location.href='tel:'+c.phone;setTimeout(render,500);
  });
  v.querySelectorAll('[data-wa]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const c=D.C.find(x=>x.id===b.dataset.wa);
    if(!c||!c.phone)return;
    D.staff=D.staff||{};D.staff[U]=D.staff[U]||{calls:0,wa:0};
    D.staff[U].wa=(D.staff[U].wa||0)+1;D.staff[U].lastSeen=nowISO();
    logAct('WhatsApp','Messaged '+c.name);
    save();window.open(waMsg(c.phone,'Assalam o Alaikum '+c.name+', '+D.set.co+' se contact kar rahe hain.'),'_blank');
    setTimeout(render,500);
  });

  // User links
  v.querySelectorAll('[data-userlink]').forEach(b=>b.onclick=()=>{
    const u=b.dataset.userlink;
    const url=userLink(TENANT,u);
    const m=el('div','modal');
    m.innerHTML=`<div class="modal-box" style="max-width:480px"><h2>🔗 User URL</h2><p class="m">Share this link with <b>${esc(u)}</b>:</p><input readonly value="${esc(url)}" style="width:100%;padding:10px;font-family:monospace;font-size:12px"><div class="row" style="margin-top:12px;gap:8px"><button class="p" id="cp" style="flex:1">📋 Copy</button><button id="cl">Close</button></div></div>`;
    document.body.appendChild(m);
    m.querySelector('#cl').onclick=()=>m.remove();
    m.onclick=e=>{if(e.target===m)m.remove()};
    m.querySelector('#cp').onclick=()=>{try{navigator.clipboard.writeText(url);toast('Copied ✓')}catch(e){}};
  });

  v.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>toast('PDF: '+b.dataset.report+' ('+currentRange().from+' to '+currentRange().to+')'));

  // Permissions
  v.querySelectorAll('[data-perm]').forEach(b=>b.onclick=()=>showPermissions(b.dataset.perm));
  v.querySelectorAll('[data-toguser]').forEach(b=>b.onclick=()=>{
    const u=b.dataset.toguser;
    const users=LS('dp_users')||{};
    if(users[u])users[u].status=users[u].status==='inactive'?'active':'inactive';
    LS('dp_users',users);
    if(TENANT)LS(uKey(TENANT),users);
    render();
  });

  // Settings
  if(v.querySelector('#saveCo')){
    v.querySelector('#saveCo').onclick=()=>{
      D.set.co=v.querySelector('#co').value||D.set.co;
      D.set.phone=v.querySelector('#cph').value;
      D.set.email=v.querySelector('#cem').value;
      D.set.addr=v.querySelector('#cad').value;
      if(v.querySelector('#clogo'))D.set.logo=v.querySelector('#clogo').value.trim();
      save();render();
    };
    v.querySelector('#au').onclick=async()=>{
      const n=v.querySelector('#nu').value.trim().toLowerCase();
      const p=v.querySelector('#np').value;
      const em=v.querySelector('#ne').value.trim();
      const us=LS('dp_users')||{};
      if(!n||p.length<4){v.querySelector('#ue').textContent='Username + password (4+)';return}
      if(!em||!em.includes('@')){v.querySelector('#ue').textContent='Gmail required for 2FA';return}
      if(us[n]){v.querySelector('#ue').textContent='Username exists';return}
      us[n]={h:await hash(n+':'+p),role:v.querySelector('#nr').value,email:em,created:nowISO(),perms:STAFF_DEFAULT.slice(),status:'active'};
      LS('dp_users',us);
      if(TENANT)LS(uKey(TENANT),us);
      D.staff=D.staff||{};D.staff[n]=D.staff[n]||{online:false,calls:0,wa:0,logins:0};
      save();render();
    };
    v.querySelectorAll('[data-ru]').forEach(b=>b.onclick=()=>{
      if(!confirm('Remove user?'))return;
      const us=LS('dp_users')||{};
      delete us[b.dataset.ru];
      LS('dp_users',us);
      if(TENANT)LS(uKey(TENANT),us);
      render();
    });
    const saveEm=v.querySelector('#saveEm');
    if(saveEm)saveEm.onclick=()=>{
      const ai=LS('dp_ai')||{};
      ai.mail=v.querySelector('#ai_mail').value.trim();
      ai.svc=v.querySelector('#ai_svc').value.trim();
      ai.tpl=v.querySelector('#ai_tpl').value.trim();
      ai.pub=v.querySelector('#ai_pub').value.trim();
      LS('dp_ai',ai);
      toast('Email saved ✓');
    };
  }
  v.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{applyTheme(b.dataset.th);render()});

  if(v.querySelector('#bgApply')){
    v.querySelector('#bgApply').onclick=()=>{
      const url=v.querySelector('#bgUrl').value.trim();
      if(!url)return;
      LS('dp_bgurl',url);
      let vid=document.getElementById('bgv');
      if(vid)vid.remove();
      vid=document.createElement('video');
      vid.id='bgv';vid.src=url;vid.muted=true;vid.loop=true;vid.autoplay=true;vid.playsInline=true;
      document.body.prepend(vid);
      toast('Video applied ✓');
    };
    v.querySelector('#bgRemove').onclick=()=>{LS('dp_bgurl',null);const vid=document.getElementById('bgv');if(vid)vid.remove();toast('Removed')};
  }

  if(v.querySelector('#setBud'))v.querySelector('#setBud').onclick=()=>{const k=tab==='house-exp'?'hbudget':'budget';const val=prompt('Budget (PKR):',D[k]||'');if(val!==null){D[k]=+val||0;save();render()}};
  if(v.querySelector('#setBudO'))v.querySelector('#setBudO').onclick=()=>{const val=prompt('Office Budget:',D.budget||'');if(val!==null){D.budget=+val||0;save();render()}};
  if(v.querySelector('#setBudH'))v.querySelector('#setBudH').onclick=()=>{const val=prompt('House Budget:',D.hbudget||'');if(val!==null){D.hbudget=+val||0;save();render()}};

  if(v.querySelector('#bkDown')){
    v.querySelector('#bkDown').onclick=()=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));
      a.download='backup-'+today()+'.json';
      a.click();
    };
    v.querySelector('#bkUp').onchange=e=>{
      const r=new FileReader();
      r.onload=()=>{try{if(!confirm('Replace data?'))return;D=Object.assign(emptyData(),JSON.parse(r.result));save();render()}catch(x){alert('Invalid')}};
      r.readAsText(e.target.files[0]);
    };
  }
}

/* ===== PERMISSIONS MODAL ===== */
function showPermissions(username){
  const users=LS('dp_users')||{};
  const u=users[username];if(!u)return;
  const perms=u.perms||STAFF_DEFAULT.slice();
  const m=el('div','modal');
  m.innerHTML=`<div class="modal-box">
    <h2 style="margin-top:0">🔐 Permissions — ${esc(username)}</h2>
    <p class="m">Check karein kaunsi cheezein yeh user kar sakta hai:</p>
    <div style="margin:14px 0;max-height:60vh;overflow:auto">
      ${PERM_LIST.map(([k,l])=>`<label class="chk-row"><input type="checkbox" data-pk="${k}" ${perms.includes(k)?'checked':''}><span>${esc(l)}</span></label>`).join('')}
    </div>
    <div class="row" style="gap:8px;margin-top:14px">
      <button class="p" id="ok" style="flex:1">💾 Save</button>
      <button id="cl">Close</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.querySelector('#cl').onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)m.remove()};
  m.querySelector('#ok').onclick=()=>{
    const list=[];
    m.querySelectorAll('[data-pk]').forEach(cb=>{if(cb.checked)list.push(cb.dataset.pk)});
    u.perms=list;
    users[username]=u;
    LS('dp_users',users);
    if(TENANT)LS(uKey(TENANT),users);
    logAct('Permissions','Updated for '+username);
    toast('Permissions updated ✓');m.remove();
  };
}

/* ===== ATTENDANCE MARK ===== */
function markAttendance(empId){
  const h=D.H.find(x=>x.id===empId);if(!h)return;
  const m=el('div','modal');
  m.innerHTML=`<div class="modal-box" style="max-width:420px">
    <h2 style="margin-top:0">📅 Mark Attendance — ${esc(h.name)}</h2>
    <label>Date</label><input id="d" type="date" value="${today()}">
    <label>Status</label><select id="s">
      <option value="P">P — Present</option>
      <option value="A">A — Absent</option>
      <option value="L">L — Leave (paid)</option>
      <option value="H">H — Half day</option>
      <option value="">Clear</option>
    </select>
    <div class="row" style="gap:8px;margin-top:14px">
      <button class="p" id="ok" style="flex:1">💾 Save</button>
      <button id="cl">Close</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.querySelector('#cl').onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)return;if(e.target===m)m.remove()};
  m.querySelector('#ok').onclick=()=>{
    const dd=m.querySelector('#d').value;
    const s=m.querySelector('#s').value;
    D.A=D.A||{};
    D.A[dd]=D.A[dd]||{};
    if(s)D.A[dd][empId]=s;else delete D.A[dd][empId];
    logAct('Attendance',h.name+' → '+(s||'clear'));
    save();m.remove();render();
  };
}

/* ===== ADVANCE FORM ===== */
function advanceForm(){
  if(!D.H.length){toast('Pehle employee add karein');return}
  form('Add Advance',[
    ['eid','Employee','select',D.H.map(h=>[h.id,h.name])],
    ['amount','Amount (PKR)','number'],
    ['date','Date','date'],
    ['note','Note']
  ],{date:today()},o=>{

    save();render();
  });
}

/* ===== TYPE MAPPING ===== */
function mapTypeToTab(t){
  return t==='listings'?'listings':t==='clients'?'clients':t==='deals'||t==='commission'?'deals':t==='money'||t==='office-exp'||t==='house-exp'?'money':t==='hr'||t==='attendance'||t==='advance'?'hr':t==='vendors'?'vendors':'listings';
}

function parseCSV(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(!lines.length)return [];
  const d=lines[0].includes('\t')?'\t':lines[0].includes(';')?';':',';
  const H=lines[0].split(d).map(h=>h.trim().replace(/^["']|["']$/g,''));
  return lines.slice(1).map(line=>{
    const vals=line.split(d).map(v=>v.trim().replace(/^["']|["']$/g,''));
    const o={};H.forEach((h,i)=>o[h]=vals[i]||'');
    return o;
  });
}

function makePDF(key){

  else if(key==='attendance'){title='Attendance';cols=['Employee','P','A','L','H'];rows=D.H.map(h=>{const att=Object.entries(D.A||{}).filter(([d,m])=>inRange(d,rg.from,rg.to)&&m[h.id]);return[esc(h.name),att.filter(([,m])=>m[h.id]==='P').length,att.filter(([,m])=>m[h.id]==='A').length,att.filter(([,m])=>m[h.id]==='L').length,att.filter(([,m])=>m[h.id]==='H').length]})}
  else if(key==='advance'){title='Advances';cols=['Date','Employee','Amount','Note'];rows=(D.Adv||[]).filter(a=>inRange(a.date,rg.from,rg.to)).map(a=>{const h=D.H.find(x=>x.id===a.eid);return[esc(a.date),esc(h?h.name:'-'),fmt(a.amount),esc(a.note||'')]})}
  else if(key==='vendors'){title='Vendor Ledger';cols=['Date','Vendor','Category','Type','Amount','Note'];rows=(D.VT||[]).filter(t=>inRange(t.date,rg.from,rg.to)).map(t=>{const v=D.V.find(x=>x.id===t.vid);return[esc(t.date),esc(v?v.name:'-'),esc(v?v.cat:''),t.dir.toUpperCase(),fmt(t.amount),esc(t.note||'')]})}
  printPDF(pdfHeader(title)+pdfTable(cols,rows));
}

async function autoMail(){

  }catch(e){}
}

 <h3>Listings ke liye (kitne clients interested)</h3>${lr.map(({l,n})=>`<div class="card row between"><span><b>${esc(l.type)} • ${esc(l.society)}</b> <span class="m sm">${esc(l.size||'')} • ${fmt(l.price)}</span></span><b>${n?'👥 '+n+' client':'— koi nahi'}</b></div>`).join('')||'<div class="card"><p class="m">Koi available listing nahi</p></div>'}`};
/* OFFICE INCOME LEDGER (commission auto) */
function syncInc(){if(typeof D==='undefined'||!D||!D.Dl)return;D.Inc=D.Inc||[];let ch=0;D.Dl.forEach(d=>{if(d.status==='Cancelled')return;const r=+d.recv||0,t=d.incT==null?0:+d.incT;if(r>t){const cl=D.C.find(c=>c.id===d.cid);D.Inc.unshift({id:uid(),date:d.incT==null?((d.date||d.at||'').slice(0,10)||today()):today(),amount:r-t,cat:'Commission',ref:d.id,note:'Commission received'+(cl?' — '+cl.name:'')});d.incT=r;ch=1}else if(r!==t){d.incT=r;ch=1}});if(ch)save()}
const _r=render;render=function(){try{syncInc()}catch(e){}return _r.apply(this,arguments)};
const IC=['Commission','Rent','Consultancy','Other'];
const inM=(d,k)=>(d||'').startsWith(k);
V['office-acc']=()=>{const rg=currentRange(),inc=(D.Inc||[]).filter(i=>inRange(i.date,rg.from,rg.to)),ex=D.E.filter(e=>(e.kind||'office')!=='house'&&inRange(e.date,rg.from,rg.to)),ti=inc.reduce((s,i)=>s+i.amount,0),te=ex.reduce((s,e)=>s+(+e.amount||0),0);
 const bal=(D.Inc||[]).reduce((s,i)=>s+i.amount,0)-D.E.filter(e=>(e.kind||'office')!=='house').reduce((s,e)=>s+(+e.amount||0),0);
 const led=[...inc.map(i=>({d:i.date,t:i.cat+(i.note?' — '+i.note:''),a:i.amount,in:1,id:i.id})),...ex.map(e=>({d:e.date,t:(e.cat||'')+' — '+(e.title||''),a:+e.amount||0}))].sort((a,b)=>a.d<b.d?1:-1);
 return`<div class="row between"><h2 style="margin:0">🏦 Office Account</h2><button class="p" id="incAdd">+ Income Add</button></div>${rangeBar('officeacc')}
 <div class="grid4"><div class="card stat"><span class="m">Income (range)</span><b class="ok">${fmt(ti)}</b></div><div class="card stat"><span class="m">Expenses (range)</span><b class="bad">${fmt(te)}</b></div><div class="card stat"><span class="m">Net (range)</span><b>${fmt(ti-te)}</b></div><div class="card stat"><span class="m">🏦 Office Balance (total)</span><b style="color:${bal<0?'var(--bad)':'var(--ok)'}">${fmt(bal)}</b></div></div>
 <p class="m sm">Commission jo aap "Received" mein likhte hain wo khud office income mein aa jati hai.</p>
 ${led.map(x=>`<div class="list-item" style="cursor:default"><div class="body"><div class="title">${esc(x.t)}</div><div class="meta">📅 ${x.d}</div></div><div class="side"><b style="color:var(--${x.in?'ok':'bad'})">${x.in?'+':'-'}${fmt(x.a)}</b>${x.in?` <button class="d xs" data-incdel="${x.id}">🗑</button>`:''}</div></div>`).join('')||'<div class="card"><p class="m">Is range mein koi entry nahi</p></div>'}`};
/* MONTHLY P&L */
let PM=today().slice(0,7);
const pl=k=>{const inc=(D.Inc||[]).filter(i=>inM(i.date,k)),ex=D.E.filter(e=>(e.kind||'office')!=='house'&&inM(e.date,k)),g=(a,f)=>{const o={};a.forEach(x=>{const c=f(x);o[c]=(o[c]||0)+(+x.amount||0)});return o};const ic=g(inc,i=>i.cat||'Other'),ec=g(ex,e=>e.cat||'Other'),ti=inc.reduce((s,i)=>s+i.amount,0),te=ex.reduce((s,e)=>s+(+e.amount||0),0);return{ic,ec,ti,te,net:ti-te}};
const plRows=o=>Object.entries(o).map(([k,v])=>`<tr><td style="padding:6px;border-bottom:1px solid #ccc">${esc(k)}</td><td style="text-align:right;border-bottom:1px solid #ccc">${fmt(v)}</td></tr>`).join('')||'<tr><td colspan=2>—</td></tr>';
V.pnl=()=>{if(!hasPerm('view_reports'))return'<div class="card"><p class="m">Permission nahi hai.</p></div>';const p=pl(PM),pd=new Date(PM+'-01');pd.setMonth(pd.getMonth()-1);const pp=pl(ld(pd).slice(0,7)),mons=[];for(let i=11;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);mons.push(ld(d).slice(0,7))}const ser=mons.map(k=>pl(k)),mx=Math.max(1,...ser.map(s=>Math.max(s.ti,s.te)));
 const mg=p.ti?Math.round(p.net*100/p.ti):0,dl=pp.net?Math.round((p.net-pp.net)*100/Math.abs(pp.net)):0;
 return`<div class="row between"><h2 style="margin:0">📑 Monthly Profit & Loss</h2><div class="row"><input type="month" id="pnlM" value="${PM}" style="max-width:170px"><button class="p" id="pnlPrint">🧾 PDF</button></div></div>
 <div class="grid4"><div class="card stat"><span class="m">Income</span><b class="ok">${fmt(p.ti)}</b></div><div class="card stat"><span class="m">Expenses</span><b class="bad">${fmt(p.te)}</b></div><div class="card stat"><span class="m">${p.net>=0?'Profit':'Loss'}</span><b style="color:var(--${p.net>=0?'ok':'bad'})">${fmt(p.net)}</b><span class="m sm">margin ${mg}% • pichle mahine se ${dl>=0?'+':''}${dl}%</span></div></div>
 <div class="pg2"><div class="card t3d"><h3 style="margin-top:0">Income</h3><table style="width:100%">${plRows(p.ic)}</table></div><div class="card t3d"><h3 style="margin-top:0">Expenses</h3><table style="width:100%">${plRows(p.ec)}</table></div></div>
 <div class="card t3d"><h3 style="margin-top:0">12 mahine ka trend</h3><div class="bars">${mons.map((k,i)=>`<div><div style="display:flex;gap:2px;align-items:flex-end;height:130px;width:100%;justify-content:center"><div class="b3" style="background:linear-gradient(180deg,#4ade80,#16a34a);height:${ser[i].ti*100/mx}%;width:38%" title="${fmt(ser[i].ti)}"></div><div class="b3" style="background:linear-gradient(180deg,#f87171,#dc2626);height:${ser[i].te*100/mx}%;width:38%" title="${fmt(ser[i].te)}"></div></div><span class="m sm">${k.slice(5)}</span></div>`).join('')}</div></div>`};
/* COMPANY LINK LOGIN + SEPARATE SUPER ADMIN */
const _av=authView;authView=function(){_av.apply(this,arguments);try{const t=new URLSearchParams(location.search).get('t'),u=new URLSearchParams(location.search).get('u')||'',tabs=$$('[data-at]');if(!tabs.length)return;
 if(t){tabs.forEach(b=>b.dataset.at==='super'&&b.remove());const b=$('[data-at="company"]');if(b){b.classList.add('on');b.onclick=null}showLoginForm('company',t,u);const p=loadPlat().tenants[t],h=$('.auth-card h1');if(h)h.textContent=p&&p.name?p.name:'Company Login';const m=$('.auth-card p.m');if(m)m.textContent='Apni company ke link se login karein.'}
 else{tabs.forEach(b=>b.dataset.at==='company'&&b.remove());const b=$('[data-at="super"]');if(b){b.classList.add('on');b.onclick=null}showLoginForm('super','',''); const m=$('.auth-card p.m');if(m)m.textContent='Platform Super Admin (company login sirf unke apne link se).'}}catch(e){}};
try{if($$('[data-at]').length)authView()}catch(e){}
/* INTEGRATIONS: server card */
const _int=V.integrations;V.integrations=()=>_int()+`<div class="card t3d"><h3 style="margin-top:0">☁️ Free Cloud (Google Drive)</h3><p>Status: <b style="color:var(--${SRV.ok?'ok':'bad'})">${SRV.ok?'Connected':'Offline (data sirf is browser mein)'}</b></p><p class="m sm">1) script.google.com → New project → sara code hata kar <b>Code.gs</b> file ka code paste karein → Save<br>2) Deploy → New deployment → type: <b>Web app</b> → Execute as: <b>Me</b> → Who has access: <b>Anyone</b> → Deploy (Google permission maange to Allow karein)<br>3) Jo <b>Web app URL</b> (…/exec) mile wo yahan paste karein.</p><input id="srvUrl" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(localStorage.getItem('dp_fb')||'')}"><div class="row" style="gap:8px;margin-top:10px"><button id="srvSave">💾 Link save</button><button class="p" id="srvUp">⬆️ Poora local data cloud par bhejein</button></div></div>`;
document.addEventListener('change',e=>{if(e.target.id==='pnlM'){PM=e.target.value||PM;render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.mf){const[a,id]=b.dataset.mf.split(':'),c=D.C.find(x=>x.id===id);if(!c)return;if(a==='show')showMatches(c);if(a==='edit')cForm(c);if(a==='del')del(D.C,id,'Delete client')}
 if(b.id==='incAdd')form('Income Add',[['cat','Category','select',IC],['amount','Amount (PKR)','number'],['date','Date','date'],['note','Note']],{cat:'Other',date:today()},o=>{D.Inc=D.Inc||[];D.Inc.unshift({id:uid(),date:o.date||today(),amount:+o.amount||0,cat:o.cat,note:o.note||''});logAct('Add income','+'+fmt(o.amount));save();render()});
 if(b.dataset.incdel&&confirm('Ye income delete karein?')){D.Inc=D.Inc.filter(i=>i.id!==b.dataset.incdel);save();render()}
 if(b.id==='pnlPrint'){const p=pl(PM);printPDF(`<div style="font-family:Arial;max-width:700px;margin:auto;color:#111"><h1 style="text-align:center">${esc(D.set.co||'')}</h1><h2 style="text-align:center">Profit & Loss — ${PM}</h2><h3>Income</h3><table style="width:100%">${plRows(p.ic)}<tr><th align=left>Total</th><th align=right>${fmt(p.ti)}</th></tr></table><h3>Expenses</h3><table style="width:100%">${plRows(p.ec)}<tr><th align=left>Total</th><th align=right>${fmt(p.te)}</th></tr></table><h2 style="text-align:right;color:${p.net>=0?'#15803d':'#b91c1c'}">${p.net>=0?'Net Profit':'Net Loss'}: ${fmt(p.net)} PKR</h2></div>`)}
 if(b.id==='srvSave'){const v=$('#srvUrl').value.trim().replace(/\/$/,'');v?localStorage.setItem('dp_fb',v):localStorage.removeItem('dp_fb');alert('Save ho gaya. Page reload hoga.');location.reload()}
 if(b.id==='srvUp'){if(!SRV.ok||!SRV.push)return alert('Pehle cloud link save karke connect hon');Object.keys(localStorage).forEach(k=>SRV.push(k,localStorage.getItem(k)));toast('⬆️ Data cloud par bhej diya')}});
})();

</script>
